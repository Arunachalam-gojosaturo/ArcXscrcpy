<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="100%" stop-color="#0D1224"/>
    </linearGradient>

    <!-- Cyan Glow Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0088AA"/>
    </linearGradient>

    <!-- Magenta Gradient -->
    <linearGradient id="magentaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2BD6"/>
      <stop offset="100%" stop-color="#991188"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Hexagon Shield -->
  <rect x="12" y="12" width="232" height="232" rx="48" fill="url(#bgGrad)" stroke="#00E5FF" stroke-opacity="0.3" stroke-width="3"/>
  <rect x="20" y="20" width="216" height="216" rx="40" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Radar Wave Rings -->
  <path d="M 68 84 A 80 80 0 0 1 188 84" fill="none" stroke="#00E5FF" stroke-width="4" stroke-linecap="round" stroke-opacity="0.4"/>
  <path d="M 88 104 A 52 52 0 0 1 168 104" fill="none" stroke="#00E5FF" stroke-width="5" stroke-linecap="round" stroke-opacity="0.8" filter="url(#neonGlow)"/>

  <!-- Stylized Cyber-A Central Core -->
  <path d="M 128 64 L 180 188 L 152 188 L 140 156 L 116 156 L 104 188 L 76 188 Z" fill="none" stroke="url(#cyanGrad)" stroke-width="8" stroke-linejoin="round" filter="url(#neonGlow)"/>
  
  <!-- Glowing Horizontal Cross-link Bridge -->
  <line x1="102" y1="144" x2="154" y2="144" stroke="#FF2BD6" stroke-width="7" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Center Core Orb -->
  <circle cx="128" cy="116" r="10" fill="#39FF88" filter="url(#neonGlow)"/>
  <circle cx="128" cy="116" r="4" fill="#FFFFFF"/>
</svg>
